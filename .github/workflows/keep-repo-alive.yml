name: Keep Repo Alive

on:
  schedule:
    - cron: '0 12 */20 * *'   # A cada 20 dias ao meio-dia
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit vazio para manter repo ativo
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit --allow-empty -m "chore: keep repo alive [skip ci]"
          git push
