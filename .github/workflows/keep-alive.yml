name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # Roda a cada 6 horas
  workflow_dispatch:          # Permite rodar manualmente também

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Wake up Streamlit app
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('Abrindo o app...');
            await page.goto('https://precosmercados-nagumo-teste-jnjp7kxzv5yudcgqfyymbh.streamlit.app', { waitUntil: 'networkidle', timeout: 60000 });
            
            const btn = page.locator('button:has-text(\"Yes, get this app back up!\")');
            if (await btn.isVisible({ timeout: 8000 }).catch(() => false)) {
              await btn.click();
              console.log('Botão clicado! App acordado.');
              await page.waitForTimeout(20000);
            } else {
              console.log('App já estava ativo.');
            }
            
            await browser.close();
          })();
          "
